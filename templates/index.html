<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Midway Players</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <h1>Midway Players</h1>
    <p>Add players first, keep each balance, then book a court from the player who is holding it.</p>
  </header>
  <main>
    <section class="panel">
      <h2>Add player</h2>
      <form id="player-form" class="player-add-form">
        <label>Player name<input id="player_name" required placeholder="John" /></label>
        <label>Starting amount ($)<input id="starting_balance" type="number" step="0.01" value="10" required /></label>
        <button type="submit">Add player</button>
      </form>
      <p id="player-msg" class="message"></p>
    </section>

    <section>
      <div class="section-head">
        <h2>Players & balances</h2>
        <button id="refresh-btn" class="secondary">Refresh</button>
      </div>
      <div id="players" class="player-cards"></div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
