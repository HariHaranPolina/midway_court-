<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Court</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <h1>Create court</h1>
    <p id="holder-line">Court holder</p>
  </header>
  <main>
    <a class="back-link" href="/">← Players</a>
    <section class="panel">
      <form id="booking-form" class="grid-form">
        <label>Court<select id="court_name">
          <option>Pickleball Court 1</option><option>Pickleball Court 2</option>
          <option>Pickleball Court 3</option><option>Pickleball Court 4</option>
          <option>Pickleball Court 5</option><option>Pickleball Court 6</option>
        </select></label>
        <label>Date<input id="booking_date" type="date" required /></label>
        <label>Start<input id="start_time" type="time" required /></label>
        <label>End<input id="end_time" type="time" required /></label>
        <label>Total court cost ($)<input id="total_cost" type="number" step="0.01" min="0" value="40" required /></label>
        <label>Max players<input id="max_players" type="number" min="1" max="20" value="6" required /></label>
        <label class="wide">Notes<input id="notes" placeholder="optional" /></label>
        <button type="submit">Create court</button>
      </form>
      <p id="booking-msg" class="message"></p>
    </section>
  </main>
  <script src="/static/new_court.js"></script>
</body>
</html>
